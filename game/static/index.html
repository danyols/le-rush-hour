<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a0b0f">
  <title>Rush Hour AR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; }
    body { background: radial-gradient(120% 90% at 50% 30%, #1a1e29 0%, #0a0b0f 70%); }
    #cam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; display: none; }
    body.has-camera #cam { display: block; }
    #gl, #overlay { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #overlay { pointer-events: none; }

    /* floating labels above each building */
    #labels { position: fixed; inset: 0; pointer-events: none; }
    .tag {
      --c: #fff; position: absolute; left: 0; top: 0; min-width: 132px; padding: 9px 11px 10px;
      border-radius: 12px; background: rgba(12, 14, 19, 0.72); border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      transform: translate(-50%, -100%); transition: opacity 0.2s; will-change: transform;
    }
    .tag .t-name { display: flex; align-items: center; gap: 7px; font-size: 0.82rem; font-weight: 600; }
    .tag .t-name .dot { color: var(--c); }
    .tag .t-meta { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 5px 0 7px; }
    .tag .t-pct { font-size: 1.05rem; font-weight: 650; letter-spacing: -0.02em; }
    .tag .t-status { font-size: 0.7rem; color: var(--muted); font-weight: 600; }
    .tag.active .t-status { color: var(--c); }
    .tag.offline .t-status, .tag.offline .t-pct { color: var(--danger); }
    .tag .bar { color: var(--c); }

    .hud { position: fixed; left: 0; right: 0; padding: 14px 16px; pointer-events: none; }
    .hud button, .hud .tune-panel { pointer-events: auto; }
    .top { top: 0; padding-top: max(14px, env(safe-area-inset-top));
      background: linear-gradient(rgba(10, 11, 15, 0.85), rgba(10, 11, 15, 0)); display: grid; gap: 8px; }
    .top .row { display: flex; align-items: center; gap: 12px; }
    .brand { font-weight: 700; letter-spacing: -0.02em; font-size: 1.02rem; display: flex; align-items: center; gap: 10px; }
    .top .stats { display: flex; gap: 18px; margin-left: auto; }
    .top .stat b { font-size: 1rem; }
    .top .event { color: var(--muted); font-size: 0.86rem; line-height: 1.35; max-width: 560px; }

    .bottom { bottom: 0; padding-bottom: max(18px, env(safe-area-inset-bottom));
      background: linear-gradient(rgba(10, 11, 15, 0), rgba(10, 11, 15, 0.88)); display: grid; gap: 14px; }
    .mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 640px; width: 100%; margin: 0 auto; }
    .mini .m-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 0.74rem; color: var(--muted); margin-bottom: 6px; }
    .mini .m-head span:first-child { display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; }
    .mini .m-head b { color: var(--text); font-weight: 600; }

    .hint { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 10px 14px; border-radius: 99px;
      background: rgba(12, 14, 19, 0.72); border: 1px solid var(--border); font-size: 0.86rem; color: var(--text);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }

    .tune-panel { display: none; gap: 12px; text-align: center; max-width: 420px; margin: 0 auto; width: 100%;
      background: rgba(18, 20, 26, 0.9); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
    body.tuning .tune-panel { display: grid; }
    body.tuning .mini, body.tuning #actions, body.tuning #labels { display: none; }
    .tune-panel .ask { font-weight: 600; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .tune-panel label { color: var(--muted); font-size: 0.82rem; display: flex; gap: 8px; justify-content: center; align-items: center; }

    /* settings sheet */
    .scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 4; }
    .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; max-width: 520px; margin: 0 auto;
      background: var(--surface); border: 1px solid var(--border); border-bottom: 0; border-radius: 20px 20px 0 0;
      padding: 20px 18px max(22px, env(safe-area-inset-bottom)); display: grid; gap: 18px;
      transform: translateY(105%); transition: transform 0.25s ease; }
    body.settings .scrim { opacity: 1; pointer-events: auto; }
    body.settings .sheet { transform: none; }
    .sheet h2 { margin: 0; font-size: 1.05rem; font-weight: 650; letter-spacing: -0.01em; }
    .sheet .help { margin: 8px 0 0; font-size: 0.84rem; color: var(--muted); line-height: 1.45; }
    .sheet .row { display: grid; gap: 8px; }

    #intro { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; z-index: 6;
      background: radial-gradient(120% 90% at 50% 20%, #171b25 0%, #0a0b0f 70%); }
    #intro .box { max-width: 380px; width: 100%; display: grid; gap: 14px; }
    #intro h1 { margin: 0 0 4px; font-size: 2.1rem; font-weight: 700; letter-spacing: -0.04em; }
    #intro p { margin: 0 0 10px; color: var(--muted); line-height: 1.55; }
    #intro .swatches { display: flex; gap: 8px; margin-bottom: 6px; }
    #intro .swatches span { width: 28px; height: 6px; border-radius: 99px; }
    #intro .err { color: var(--danger); font-size: 0.88rem; margin: 0; }
    #intro a { color: var(--muted); font-size: 0.88rem; text-align: center; }
  </style>
</head>
<body>
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="gl"></canvas>
  <canvas id="overlay"></canvas>
  <div id="labels"></div>

  <header class="hud top">
    <div class="row">
      <div class="brand">Rush Hour <span class="chip live" id="phase">Connecting</span></div>
      <div class="stats">
        <div class="stat"><b id="time">-:--</b><span class="label-caps">Left</span></div>
        <div class="stat"><b id="uptime">100%</b><span class="label-caps">Uptime</span></div>
      </div>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </div>
    <div class="event" id="event"></div>
  </header>

  <div class="hint" id="hint" style="opacity:0"></div>

  <footer class="hud bottom">
    <div class="mini" id="mini"></div>
    <div class="actions" id="actions"></div>
    <div class="tune-panel">
      <div class="ask" id="tuneAsk"></div>
      <label><input type="checkbox" id="showMask" checked> Show what the phone detects</label>
      <div class="actions">
        <button class="btn small" id="tuneSkip">Skip</button>
        <button class="btn small" id="tuneReset">Reset colors</button>
        <button class="btn small primary" id="tuneDone">Done</button>
      </div>
    </div>
  </footer>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet">
    <div style="display:flex; justify-content:space-between; align-items:center">
      <h2>Settings</h2>
      <button class="btn small ghost" id="closeSettings">Close</button>
    </div>
    <div class="row">
      <span class="label-caps">Building placement</span>
      <div class="segmented" id="placement">
        <button data-mode="preview">Preview</button>
        <button data-mode="color">Rings</button>
        <button data-mode="cards">Cards</button>
      </div>
      <p class="help" id="placementHelp"></p>
    </div>
    <div class="row" id="previewTools">
      <button class="btn small" id="resetLayout">Reset building positions</button>
    </div>
    <div class="row" id="ringTools">
      <button class="btn small" id="tuneBtn">Calibrate ring colors</button>
    </div>
  </div>

  <div id="intro">
    <div class="box">
      <div class="swatches"><span style="background:var(--red)"></span><span style="background:var(--green)"></span><span style="background:var(--yellow)"></span></div>
      <h1>Rush Hour</h1>
      <p>Three buildings are losing power. The robot carries the generator to recharge them. Watch the city through your camera and keep the lights on.</p>
      <button class="btn primary block" id="go">Start camera</button>
      <button class="btn block" id="noCam">Continue without camera</button>
      <p class="err" id="err"></p>
      <a href="/board">Open the board</a>
    </div>
  </div>

  <script src="/static/vendor/js-aruco2/cv.js"></script>
  <script src="/static/vendor/js-aruco2/aruco.js"></script>
  <script src="/static/colortrack.js"></script>
  <script src="/static/game.js"></script>
  <script type="module">
    import * as THREE from "/static/vendor/three/three.module.min.js";

    const $ = (id) => document.getElementById(id);
    const video = $("cam"), overlay = $("overlay"), octx = overlay.getContext("2d");
    const params = new URLSearchParams(location.search);
    const store = {
      get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
      set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
      del(k) { try { localStorage.removeItem(k); } catch (e) {} },
    };

    const IDS = ["red", "green", "yellow"];
    const DEFAULT_BUILDINGS = [
      { id: "red", name: "Fire Station", color: "#ff5a5f", energy: 100 },
      { id: "green", name: "Hospital", color: "#2fd38a", energy: 75 },
      { id: "yellow", name: "Shelter", color: "#f5c84b", energy: 50 },
    ];

    let game = null;
    let serverTrack = "preview";
    let phoneTrack = params.get("track") || store.get("rushhour.track", null);
    const track = () => phoneTrack || serverTrack; // "preview" | "color" | "cards"
    let cameraOn = false;

    // ================= three.js scene =================
    const renderer = new THREE.WebGLRenderer({ canvas: $("gl"), alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(55, 1, 0.01, 200);
    scene.add(new THREE.HemisphereLight(0xe4e9ff, 0x15171f, 1.5));
    const sun = new THREE.DirectionalLight(0xffffff, 1.8);
    sun.position.set(2.5, 5, 4);
    scene.add(sun);

    function resize() {
      const w = innerWidth, h = innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      overlay.width = Math.round(w * dpr); overlay.height = Math.round(h * dpr);
    }
    addEventListener("resize", resize);
    resize();

    const glowTexture = (() => {
      const c = document.createElement("canvas"); c.width = c.height = 128;
      const g = c.getContext("2d");
      const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
      grad.addColorStop(0, "rgba(255,255,255,1)"); grad.addColorStop(0.35, "rgba(255,255,255,0.35)"); grad.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
      const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
    })();

    const PAD_WORLD = 1.5; // world width the base pad occupies; screen size maps to this
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd7dbe3, roughness: 0.8, metalness: 0.0 });
    const roofMat = new THREE.MeshStandardMaterial({ color: 0xf0f2f6, roughness: 0.7, metalness: 0.0 });
    const OFFLINE = new THREE.Color("#ff6b6b");
    const DIM = new THREE.Color("#3a3f4c");

    class BuildingModel {
      constructor(def) {
        this.id = def.id;
        this.color = new THREE.Color(def.color);
        this.group = new THREE.Group();
        this.body = new THREE.Group(); // the building itself, scaled up relative to the base pad
        this.body.scale.setScalar(1.25);
        this.group.add(this.body);
        this.floors = []; // window materials, bottom to top
        this.shownEnergy = def.energy / 100;
        this.pop = 0;

        const padMat = new THREE.MeshStandardMaterial({ color: 0x14171e, roughness: 0.6, emissive: this.color, emissiveIntensity: 0.2 });
        const pad = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.66, 0.05, 56), padMat);
        pad.position.y = 0.025;
        this.padMat = padMat;
        this.group.add(pad);

        this.ringMat = new THREE.MeshBasicMaterial({ color: this.color, transparent: true, opacity: 0.6, side: THREE.DoubleSide, depthWrite: false });
        const ring = new THREE.Mesh(new THREE.RingGeometry(0.68, 0.73, 72), this.ringMat);
        ring.rotation.x = -Math.PI / 2; ring.position.y = 0.006;
        this.group.add(ring);

        this.pulseMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false });
        this.pulse = new THREE.Mesh(new THREE.RingGeometry(0.74, 0.79, 72), this.pulseMat);
        this.pulse.rotation.x = -Math.PI / 2; this.pulse.position.y = 0.008;
        this.group.add(this.pulse);

        this.top = this.buildShape(def.id) * this.body.scale.y;

        this.haloMat = new THREE.SpriteMaterial({ map: glowTexture, color: this.color, transparent: true, opacity: 0.4,
          blending: THREE.AdditiveBlending, depthWrite: false });
        this.halo = new THREE.Sprite(this.haloMat);
        this.halo.position.y = this.top * 0.45;
        this.halo.scale.setScalar(2.6);
        this.group.add(this.halo);

        this.chargeMat = new THREE.MeshBasicMaterial({ color: this.color, transparent: true, opacity: 0, depthWrite: false });
        this.chargeRing = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.014, 8, 72), this.chargeMat);
        this.chargeRing.rotation.x = Math.PI / 2;
        this.group.add(this.chargeRing);

        this.beaconMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 });
        this.beacon = new THREE.Mesh(new THREE.SphereGeometry(0.035, 16, 12), this.beaconMat);
        this.beacon.position.y = this.top + 0.12;
        const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.12, 6), roofMat);
        mast.position.y = this.top + 0.06;
        this.group.add(mast, this.beacon);

        this.group.visible = false;
        scene.add(this.group);
      }

      // A box split into floors: a solid slab plus an emissive window band per floor.
      block(x, z, w, d, floors, floorH, y0) {
        for (let i = 0; i < floors; i++) {
          const y = y0 + i * floorH;
          const slab = new THREE.Mesh(new THREE.BoxGeometry(w, floorH * 0.45, d), bodyMat);
          slab.position.set(x, y + floorH * 0.225, z);
          const winMat = new THREE.MeshStandardMaterial({ color: 0x252932, roughness: 0.35, metalness: 0.1, emissive: this.color, emissiveIntensity: 1 });
          const band = new THREE.Mesh(new THREE.BoxGeometry(w * 0.97, floorH * 0.55, d * 0.97), winMat);
          band.position.set(x, y + floorH * 0.725, z);
          this.body.add(slab, band);
          this.floors.push({ mat: winMat, y });
        }
        const capY = y0 + floors * floorH;
        const cap = new THREE.Mesh(new THREE.BoxGeometry(w * 1.04, 0.03, d * 1.04), roofMat);
        cap.position.set(x, capY + 0.015, z);
        this.body.add(cap);
        return capY + 0.03;
      }

      buildShape(id) {
        let top;
        if (id === "red") { // fire station: wide garage + slim hose tower
          this.block(-0.14, 0.04, 0.66, 0.52, 3, 0.17, 0.05);
          top = this.block(0.33, -0.12, 0.24, 0.24, 7, 0.16, 0.05);
        } else if (id === "green") { // hospital: wide base, center tower, roof cross
          const baseTop = this.block(0, 0, 0.86, 0.5, 3, 0.16, 0.05);
          top = this.block(0, 0, 0.38, 0.38, 5, 0.16, baseTop);
          const crossMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: this.color, emissiveIntensity: 1.4 });
          this.crossMat = crossMat;
          const a = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.04, 0.06), crossMat);
          const b = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.04, 0.2), crossMat);
          a.position.y = b.position.y = top + 0.02;
          this.body.add(a, b);
          top += 0.04;
        } else { // shelter: low block with a pitched roof
          const wallTop = this.block(0, 0, 0.78, 0.58, 2, 0.18, 0.05);
          const w = 0.86, h = 0.34, d = 0.66;
          const shape = new THREE.Shape([new THREE.Vector2(-w / 2, 0), new THREE.Vector2(w / 2, 0), new THREE.Vector2(0, h)]);
          const roofGeo = new THREE.ExtrudeGeometry(shape, { depth: d, bevelEnabled: false });
          roofGeo.translate(0, 0, -d / 2);
          const roof = new THREE.Mesh(roofGeo, roofMat);
          roof.position.y = wallTop;
          this.body.add(roof);
          top = wallTop + h;
        }
        this.floors.sort((p, q) => p.y - q.y);
        return top;
      }

      update(b, s, t, dt) {
        const target = b ? b.energy / 100 : 1;
        this.shownEnergy += (target - this.shownEnergy) * Math.min(1, dt * 4);
        const e = this.shownEnergy;
        const offline = b && b.energy <= 0;
        const low = !offline && e < 0.25;
        const flick = low ? (Math.sin(t * 23) * Math.sin(t * 7.1) > 0.15 ? 0.35 : 1) : 1;
        const charging = b && b.charging;
        const incoming = b && s && s.phase === "dispatch" && s.target === b.id;

        // floors light up from the bottom with the energy level; the top lit floor fades smoothly
        const level = e * this.floors.length;
        this.floors.forEach((f, i) => {
          const lit = Math.max(0, Math.min(1, level - i));
          f.mat.emissiveIntensity = offline ? 0 : (0.06 + 1.9 * lit) * flick;
        });
        if (this.crossMat) this.crossMat.emissiveIntensity = offline ? 0 : 0.3 + 1.4 * e * flick;

        this.padMat.emissive.copy(offline ? OFFLINE : this.color);
        this.padMat.emissiveIntensity = offline ? 0.15 + 0.1 * Math.sin(t * 4) : 0.05 + 0.35 * e * flick;
        this.ringMat.color.copy(offline ? OFFLINE : this.color);
        this.ringMat.opacity = offline ? 0.6 : 0.35 + 0.6 * e;
        this.haloMat.opacity = offline ? 0 : (0.04 + 0.42 * e) * flick;

        const p = (t % 1.3) / 1.3;
        this.pulse.scale.setScalar(1 + p * 0.7);
        this.pulseMat.opacity = incoming ? (1 - p) * 0.9 : 0;
        this.beaconMat.color.copy(incoming ? new THREE.Color(0xffffff) : offline ? DIM : this.color);
        this.beaconMat.opacity = incoming ? (Math.sin(t * 9) > 0 ? 1 : 0.15) : offline ? 0.4 : 0.9;

        const c = (t * 0.7) % 1;
        this.chargeRing.position.y = 0.05 + c * this.top;
        this.chargeRing.scale.setScalar(1 - c * 0.35);
        this.chargeMat.opacity = charging ? Math.sin(c * Math.PI) * 0.9 : 0;
      }
    }

    const models = Object.fromEntries(DEFAULT_BUILDINGS.map((d) => [d.id, new BuildingModel(d)]));

    // ================= anchors: where each building stands on screen =================
    // { x, y, size (css px of the base pad), seen (ms) }. The table normal is shared by all buildings.
    const anchors = {};
    const PREVIEW_ELEVATION = THREE.MathUtils.degToRad(28);
    const tableNormal = new THREE.Vector3(0, Math.cos(PREVIEW_ELEVATION), Math.sin(PREVIEW_ELEVATION));
    const PREVIEW_NORMAL = tableNormal.clone();
    const KEEP_MS = 1200;

    function previewLayout() {
      const saved = store.get("rushhour.layout", null);
      const w = innerWidth, h = innerHeight, portrait = h > w;
      const size = Math.min(w, h) * (portrait ? 0.27 : 0.24);
      const def = portrait
        ? { red: [0.22, 0.6], green: [0.5, 0.5], yellow: [0.78, 0.6] }
        : { red: [0.28, 0.66], green: [0.5, 0.58], yellow: [0.72, 0.66] };
      const out = {};
      for (const id of IDS) {
        const [fx, fy] = (saved && saved[id]) || def[id];
        out[id] = { x: fx * w, y: fy * h, size, seen: Infinity };
      }
      return out;
    }

    // ---- ring constellation: predict a hidden ring from the visible ones ----
    let layout = null;   // screen positions of all three rings, captured when all were visible
    let lastScale = 1;
    function predictMissing(found) {
      const vis = IDS.filter((id) => found[id]);
      if (vis.length === 3) {
        layout = Object.fromEntries(IDS.map((id) => [id, { x: found[id].x, y: found[id].y }]));
        lastScale = 1;
        return;
      }
      if (!layout || !vis.length) return;
      // similarity transform z' = s*z + t (complex numbers), from two visible rings or translation from one
      let s = { re: lastScale, im: 0 }, tx, ty;
      if (vis.length >= 2) {
        const [a, b] = vis;
        const lx = layout[b].x - layout[a].x, ly = layout[b].y - layout[a].y;
        const cx = found[b].x - found[a].x, cy = found[b].y - found[a].y;
        const den = lx * lx + ly * ly || 1;
        s = { re: (cx * lx + cy * ly) / den, im: (cy * lx - cx * ly) / den };
        lastScale = Math.hypot(s.re, s.im);
      }
      const a = vis[0];
      tx = found[a].x - (s.re * layout[a].x - s.im * layout[a].y);
      ty = found[a].y - (s.im * layout[a].x + s.re * layout[a].y);
      const size = vis.reduce((acc, id) => acc + found[id].size, 0) / vis.length;
      for (const id of IDS) {
        if (found[id]) continue;
        found[id] = { x: s.re * layout[id].x - s.im * layout[id].y + tx, y: s.im * layout[id].x + s.re * layout[id].y + ty,
          size, predicted: true };
      }
    }

    // table normal from an ellipse (a circle seen at an angle): minor/major = sin(elevation),
    // and the minor axis points "up" the table on screen
    function normalFromEllipse(angle, hu, hv) {
      const sinE = Math.max(0.3, Math.min(1, hv / hu));
      const cosE = Math.sqrt(1 - sinE * sinE);
      let ux = Math.cos(angle + Math.PI / 2), uy = Math.sin(angle + Math.PI / 2);
      if (uy > 0) { ux = -ux; uy = -uy; } // point up on screen
      return new THREE.Vector3(cosE * ux, -uy * cosE, sinE).normalize();
    }

    // ---- "up" from the phone's motion sensor: the real table normal, independent of the markers ----
    // W3C deviceorientation (beta, gamma) -> world up in device coords -> screen/camera coords.
    let gravityUp = null;
    function onOrientation(e) {
      if (e.beta == null || e.gamma == null) return;
      const b = THREE.MathUtils.degToRad(e.beta), g = THREE.MathUtils.degToRad(e.gamma);
      const dx = -Math.sin(g) * Math.cos(b), dy = Math.sin(b), dz = Math.cos(b) * Math.cos(g);
      const a = THREE.MathUtils.degToRad((screen.orientation && screen.orientation.angle) || window.orientation || 0);
      const up = new THREE.Vector3(dx * Math.cos(a) - dy * Math.sin(a), dx * Math.sin(a) + dy * Math.cos(a), dz);
      gravityUp = gravityUp ? gravityUp.lerp(up, 0.25).normalize() : up.normalize();
    }
    async function enableMotion() {
      try {
        if (typeof DeviceOrientationEvent !== "undefined" && DeviceOrientationEvent.requestPermission)
          if ((await DeviceOrientationEvent.requestPermission()) !== "granted") return;
        addEventListener("deviceorientation", onOrientation);
      } catch (e) { /* no sensor or permission denied: fall back to the rings */ }
    }

    function ellipseFromPoints(pts) {
      const n = pts.length, cx = pts.reduce((a, p) => a + p.x, 0) / n, cy = pts.reduce((a, p) => a + p.y, 0) / n;
      let xx = 0, yy = 0, xy = 0;
      for (const p of pts) { xx += (p.x - cx) ** 2; yy += (p.y - cy) ** 2; xy += (p.x - cx) * (p.y - cy); }
      xx /= n; yy /= n; xy /= n;
      const tr = xx + yy, disc = Math.sqrt(Math.max(0, tr * tr / 4 - (xx * yy - xy * xy)));
      return { cx, cy, angle: 0.5 * Math.atan2(2 * xy, xx - yy), hu: Math.sqrt(tr / 2 + disc), hv: Math.sqrt(Math.max(tr / 2 - disc, 1e-6)) };
    }

    // ================= detection =================
    const work = document.createElement("canvas");
    const workCtx = work.getContext("2d", { willReadFrequently: true });
    const aruco = new AR.Detector({ dictionaryName: "ARUCO_MIP_36h12" });
    let profiles = { ...ColorTrack.DEFAULTS, ...(store.get("rushhour.colors", {}) || {}) };
    let lastFrame = null;
    let tuneStep = -1;

    function detect(now) {
      const vw = video.videoWidth, vh = video.videoHeight;
      if (!vw) return null;
      const W = innerWidth, H = innerHeight;
      const scale = Math.max(W / vw, H / vh); // same "cover" crop as the <video> element
      const sw = W / scale, sh = H / scale, sx = (vw - sw) / 2, sy = (vh - sh) / 2;
      const k = Math.min(1, (track() === "cards" ? 640 : 480) / Math.max(sw, sh));
      const dw = Math.round(sw * k), dh = Math.round(sh * k);
      if (work.width !== dw || work.height !== dh) { work.width = dw; work.height = dh; }
      workCtx.drawImage(video, sx, sy, sw, sh, 0, 0, dw, dh);
      const image = workCtx.getImageData(0, 0, dw, dh);
      lastFrame = { image, dw, dh };
      const fx = W / dw, fy = H / dh;
      const found = {}, normals = [];

      if (track() === "color") {
        const showMask = tuneStep >= 0 && $("showMask").checked;
        const mask = showMask ? new ImageData(dw, dh) : null;
        const res = ColorTrack.detect(image, profiles, mask && mask.data);
        for (const id of IDS) {
          const r = res[id];
          if (!r) continue;
          found[id] = { x: r.cx * fx, y: r.cy * fy, size: Math.max(2 * r.hu * fx * 2.2, 56) };
          if (r.hu * fx >= 36) normals.push({ n: normalFromEllipse(r.angle, r.hu, r.hv), w: r.hu }); // small rings: shape too blurry
        }
        octx.clearRect(0, 0, overlay.width, overlay.height);
        if (mask) {
          const m = document.createElement("canvas"); m.width = dw; m.height = dh;
          m.getContext("2d").putImageData(mask, 0, 0);
          octx.imageSmoothingEnabled = false;
          octx.drawImage(m, 0, 0, overlay.width, overlay.height);
        }
      } else if (track() === "cards" && game) {
        for (const m of aruco.detect(image)) {
          const b = game.buildings.find((x) => x.marker_id === m.id);
          if (!b) continue;
          const el = ellipseFromPoints(m.corners);
          found[b.id] = { x: el.cx * fx, y: el.cy * fy, size: Math.max(2 * el.hu * fx * 1.9, 56) };
          if (el.hu * fx >= 36) normals.push({ n: normalFromEllipse(el.angle, el.hu, el.hv), w: el.hu });
        }
      }
      predictMissing(found);

      // shared table normal: gravity if the phone has a motion sensor, else the marker shapes, else a default
      if (gravityUp) tableNormal.lerp(gravityUp, 0.3).normalize();
      else if (normals.length) {
        const avg = new THREE.Vector3();
        for (const { n, w } of normals) avg.addScaledVector(n, w);
        tableNormal.lerp(avg.normalize(), 0.12).normalize();
      } else tableNormal.lerp(PREVIEW_NORMAL, 0.05).normalize();
      for (const id of IDS) {
        const f = found[id];
        if (!f) continue;
        const a = anchors[id];
        if (a && now - a.seen < KEEP_MS) {
          const k2 = f.predicted ? 0.25 : 0.45;
          a.x += (f.x - a.x) * k2; a.y += (f.y - a.y) * k2; a.size += (f.size - a.size) * 0.25;
        } else anchors[id] = { x: f.x, y: f.y, size: f.size };
        anchors[id].seen = now;
      }
      return found;
    }

    // ================= placing buildings in 3D =================
    const _m = new THREE.Matrix4(), _v = new THREE.Vector3();
    function place(model, a) {
      const focal = (innerHeight / 2) / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      const dist = (PAD_WORLD * focal) / a.size;
      _v.set((a.x / innerWidth) * 2 - 1, -(a.y / innerHeight) * 2 + 1, 0.5).unproject(camera).normalize();
      model.group.position.copy(_v).multiplyScalar(dist);
      const up = tableNormal;
      const toCam = model.group.position.clone().negate().normalize();
      const fwd = toCam.sub(up.clone().multiplyScalar(toCam.dot(up))).normalize();
      const right = new THREE.Vector3().crossVectors(up, fwd);
      _m.makeBasis(right, up, fwd);
      model.group.quaternion.setFromRotationMatrix(_m);
      const p = model.pop; // pop-up: ease out back
      const s = p <= 0 ? 0.001 : 1 + 2.2 * Math.pow(p - 1, 3) + 1.2 * Math.pow(p - 1, 2);
      model.group.scale.setScalar(Math.max(0.001, s));
    }

    // ================= labels and HUD =================
    const tags = {};
    for (const d of DEFAULT_BUILDINGS) {
      const el = document.createElement("div");
      el.className = "tag";
      el.style.setProperty("--c", d.color);
      el.innerHTML = `<div class="t-name"><span class="dot"></span>${d.name}</div>
        <div class="t-meta"><span class="t-pct"></span><span class="t-status"></span></div><div class="bar"><i></i></div>`;
      $("labels").appendChild(el);
      tags[d.id] = el;
    }
    $("mini").innerHTML = DEFAULT_BUILDINGS.map((d) => `<div><div class="m-head"><span><span class="dot" style="color:${d.color}"></span>${d.name}</span><b data-pct></b></div>
      <div class="bar" style="color:${d.color}"><i></i></div></div>`).join("");

    RushHour.onState((s) => {
      game = s;
      RushHour.renderActions($("actions"), s);
      $("phase").textContent = RushHour.phaseLabel(s);
      if (!s) { $("event").textContent = "Disconnected. Reconnecting..."; return; }
      serverTrack = s.track || "preview";
      syncSettings();
      $("time").textContent = RushHour.fmtTime(s.time_left);
      $("uptime").textContent = `${Math.round(s.uptime * 100)}%`;
      $("event").textContent = s.event;
      s.buildings.forEach((b, i) => {
        const col = $("mini").children[i];
        col.querySelector("[data-pct]").textContent = `${Math.round(b.energy)}%`;
        col.querySelector("i").style.width = `${b.energy}%`;
      });
    });

    function updateTag(id, model, b) {
      const el = tags[id];
      if (!model.group.visible || model.pop < 0.6 || tuneStep >= 0) { el.style.opacity = 0; el._pos = null; return; }
      const p = model.group.localToWorld(new THREE.Vector3(0, model.top + 0.3, 0)).project(camera);
      const top = document.querySelector(".top").getBoundingClientRect().bottom;
      const bottom = document.querySelector(".bottom").getBoundingClientRect().top;
      const h = el.offsetHeight || 80;
      const x = Math.max(76, Math.min(innerWidth - 76, (p.x * 0.5 + 0.5) * innerWidth));
      const y = Math.max(top + h + 4, Math.min(bottom - 4, (-p.y * 0.5 + 0.5) * innerHeight));
      el.style.opacity = 1;
      el._pos = { x, y };
      const energy = b ? b.energy : 100;
      const status = b && game ? RushHour.buildingStatus(game, b) : "Waiting";
      el.classList.toggle("active", status === "Charging" || status === "Incoming");
      el.classList.toggle("offline", status === "Offline");
      el.querySelector(".t-pct").textContent = `${Math.round(energy)}%`;
      el.querySelector(".t-status").textContent = status;
      el.querySelector(".bar i").style.width = `${energy}%`;
    }

    // nudge overlapping labels apart horizontally, then apply positions
    function layoutTags() {
      const list = IDS.map((id) => tags[id]).filter((el) => el._pos);
      const w = (el) => el.offsetWidth || 140, h = (el) => el.offsetHeight || 80;
      for (let pass = 0; pass < 4; pass++)
        for (let i = 0; i < list.length; i++)
          for (let j = i + 1; j < list.length; j++) {
            const a = list[i]._pos, b = list[j]._pos;
            const ox = (w(list[i]) + w(list[j])) / 2 + 8 - Math.abs(a.x - b.x);
            const oy = (h(list[i]) + h(list[j])) / 2 + 6 - Math.abs(a.y - b.y);
            if (ox > 0 && oy > 0) {
              const dir = a.x <= b.x ? 1 : -1;
              a.x -= (dir * ox) / 2; b.x += (dir * ox) / 2;
            }
          }
      for (const el of list) {
        const x = Math.max(w(el) / 2 + 8, Math.min(innerWidth - w(el) / 2 - 8, el._pos.x));
        el.style.transform = `translate(${x.toFixed(1)}px, ${el._pos.y.toFixed(1)}px) translate(-50%, -100%)`;
      }
    }

    // ================= render loop =================
    let last = performance.now();
    let started = 0;
    function frame(now) {
      requestAnimationFrame(frame);
      const dt = Math.min(0.1, (now - last) / 1000); last = now;
      const t = now / 1000;
      const mode = track();

      let current;
      if (mode === "preview" || !cameraOn) {
        current = previewLayout();
        if (cameraOn && gravityUp) tableNormal.lerp(gravityUp, 0.3).normalize(); // previewing over the camera: stand upright for real
        else tableNormal.copy(PREVIEW_NORMAL);
        octx.clearRect(0, 0, overlay.width, overlay.height);
      } else {
        detect(now);
        current = anchors;
      }

      let visible = 0;
      IDS.forEach((id, i) => {
        const model = models[id];
        const a = current[id];
        const shown = a && now - a.seen < KEEP_MS && tuneStep < 0;
        const delay = mode === "preview" || !cameraOn ? i * 0.15 : 0;
        const ready = (now - started) / 1000 > delay;
        model.pop = Math.max(0, Math.min(1, model.pop + (shown && ready ? dt * 2.2 : -dt * 4)));
        model.group.visible = model.pop > 0.001;
        if (model.group.visible) { place(model, a || { x: 0, y: 0, size: 100 }); visible++; }
        const b = game ? RushHour.byId(game, id) : null;
        model.update(b, game, t, dt);
        updateTag(id, model, b);
      });
      renderer.render(scene, camera);
      layoutTags();
      // with the camera on and every building in view, the labels already show energy
      $("mini").style.display = cameraOn && mode !== "preview" && visible === 3 ? "none" : "";

      const hint = $("hint");
      const needMarkers = cameraOn && mode !== "preview" && tuneStep < 0;
      hint.textContent = mode === "cards" ? "Point your camera at the marker cards" : "Point your camera at the colored rings";
      hint.style.opacity = needMarkers && !visible ? 1 : 0;
    }

    function begin(withCamera) {
      cameraOn = withCamera;
      document.body.classList.toggle("has-camera", withCamera);
      $("intro").style.display = "none";
      started = performance.now();
      syncSettings();
      requestAnimationFrame(frame);
    }

    $("go").onclick = async () => {
      $("err").textContent = "";
      const motion = enableMotion(); // must start inside the tap on iOS
      if (!navigator.mediaDevices?.getUserMedia) {
        $("err").textContent = "This browser can't open the camera here. Use the https link from the QR code.";
        return;
      }
      try {
        video.srcObject = await navigator.mediaDevices.getUserMedia({
          audio: false, video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
        });
        await video.play();
        await motion;
        begin(true);
      } catch (e) {
        $("err").textContent = `Camera unavailable: ${e.message || e.name}. Allow camera access and try again.`;
      }
    };
    $("noCam").onclick = () => begin(false);

    // ================= dragging buildings in preview =================
    let drag = null;
    $("gl").addEventListener("pointerdown", (e) => {
      if (tuneStep >= 0) return onTuneTap(e);
      if (track() !== "preview" && cameraOn) return;
      const lay = previewLayout();
      const hit = IDS.map((id) => ({ id, d: Math.hypot(e.clientX - lay[id].x, e.clientY - (lay[id].y - lay[id].size * 0.4)) }))
        .sort((p, q) => p.d - q.d)[0];
      if (hit.d < lay[hit.id].size * 0.8) drag = hit.id;
    });
    addEventListener("pointermove", (e) => {
      if (!drag) return;
      const saved = store.get("rushhour.layout", {}) || {};
      saved[drag] = [e.clientX / innerWidth, Math.min(0.9, Math.max(0.2, e.clientY / innerHeight))];
      store.set("rushhour.layout", saved);
    });
    addEventListener("pointerup", () => { drag = null; });

    // ================= settings =================
    const HELP = {
      preview: "Buildings appear in front of you without markers. Drag them to move them. Use this to test the AR view.",
      color: "Buildings stand on the red, green and yellow rings. If one is hidden by the cube or the arm, it stays in place.",
      cards: "Buildings stand on the printed marker cards from /markers. Most robust in difficult lighting.",
    };
    function syncSettings() {
      const m = track();
      for (const b of $("placement").children) b.setAttribute("aria-pressed", String(b.dataset.mode === m));
      $("placementHelp").textContent = HELP[m];
      $("ringTools").style.display = m === "color" ? "grid" : "none";
      $("previewTools").style.display = m === "preview" ? "grid" : "none";
    }
    const openSettings = (on) => document.body.classList.toggle("settings", on);
    $("settingsBtn").onclick = () => openSettings(true);
    $("closeSettings").onclick = $("scrim").onclick = () => openSettings(false);
    for (const b of $("placement").children)
      b.onclick = () => { phoneTrack = b.dataset.mode; store.set("rushhour.track", phoneTrack); syncSettings(); };
    $("resetLayout").onclick = () => store.del("rushhour.layout");
    syncSettings();

    // ================= ring color calibration =================
    function showTuneStep() {
      if (tuneStep >= IDS.length) return endTuning();
      const d = DEFAULT_BUILDINGS[tuneStep];
      $("tuneAsk").innerHTML = `<span class="dot" style="color:${d.color}"></span>Tap the ${d.id} ring`;
    }
    function endTuning() {
      tuneStep = -1;
      document.body.classList.remove("tuning");
      octx.clearRect(0, 0, overlay.width, overlay.height);
    }
    $("tuneBtn").onclick = () => {
      openSettings(false);
      if (!cameraOn) return;
      tuneStep = 0; document.body.classList.add("tuning"); showTuneStep();
    };
    $("tuneSkip").onclick = () => { tuneStep++; showTuneStep(); };
    $("tuneDone").onclick = endTuning;
    $("tuneReset").onclick = () => { profiles = { ...ColorTrack.DEFAULTS }; store.del("rushhour.colors"); tuneStep = 0; showTuneStep(); };
    function onTuneTap(e) {
      if (!lastFrame) return;
      const { image, dw, dh } = lastFrame;
      const x = (e.clientX / innerWidth) * dw, y = (e.clientY / innerHeight) * dh;
      const id = IDS[tuneStep];
      profiles[id] = ColorTrack.profileFromSample(id, ColorTrack.sample(image, x, y, 2));
      store.set("rushhour.colors", { red: profiles.red, green: profiles.green, yellow: profiles.yellow });
      tuneStep++;
      showTuneStep();
    }

    // expose for debugging / tests
    window.rushhourDebug = { anchors, models, tableNormal, track, gravity: () => gravityUp, onOrientation };
  </script>
</body>
</html>
